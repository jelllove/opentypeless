name: Fork Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == 'jelllove/opentypeless' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: src-tauri -> target
      - name: Validate stable tag and versions
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Only stable version tags are supported.' }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($package.version -ne $version -or $tauri.version -ne $version) { throw 'Tag and package versions differ.' }
          if ((Get-Content src-tauri/Cargo.toml -Raw) -notmatch ('(?m)^version = "' + [regex]::Escape($version) + '"')) { throw 'Cargo package version differs.' }
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          if ($lock['version'] -ne $version -or $lock['packages']['']['version'] -ne $version) { throw 'npm lock version differs.' }
          $tagCommit = git rev-list -n 1 $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) { throw 'Tag must point to the workflow source commit.' }
          "VITE_APP_VERSION=$version" >> $env:GITHUB_ENV
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --audit-level=high
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --release --target x86_64-pc-windows-msvc --locked --lib -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --release --target x86_64-pc-windows-msvc --locked --lib
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
      - name: Build signed updater payload (no Authenticode certificate)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY -or !$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { throw 'Fork updater signing secrets are required.' }
          npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis --no-sign --ci -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Tauri CLI --no-sign also skips updater signatures; sign the final installer explicitly.
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          npm run tauri -- signer sign "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/OpenTypeless_${version}_x64-setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate update manifest and checksums
        shell: pwsh
        run: |
          node scripts/build-update-manifest.mjs src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis ($env:GITHUB_REF_NAME -replace '^v', '')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish fork release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          $dir = 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          # Never replace an existing release or its update metadata silently.
          gh release view $tag --repo jelllove/opentypeless *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; inspect it instead of overwriting.' }
          $notes = "Source: $env:GITHUB_SHA. Windows x64 only. Updater payload signatures are verified by the app; the installer is not Authenticode signed and Windows may show an Unknown Publisher warning. Existing 1.3.0 installations require one manual upgrade to adopt the fork signing key. Later updates download automatically and install only on an explicit restart action."
          gh release create $tag --repo jelllove/opentypeless --verify-tag --title "OpenTypeless $tag" --notes $notes "$dir/OpenTypeless_${version}_x64-setup.exe" "$dir/OpenTypeless_${version}_x64-setup.exe.sig" "$dir/latest.json" "$dir/SHA256SUMS.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
